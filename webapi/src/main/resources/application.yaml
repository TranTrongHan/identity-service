spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/identity
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'

identity:
  bypass-user-ids:
    - "f4c4e181-f7c3-4880-b1ab-dd1c91e7f2df"
